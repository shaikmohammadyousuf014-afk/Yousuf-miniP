
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YousufMart - Online Shopping</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>YousufMart</h1>
        <p>Online Shopping Cart Management System</p>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="#home">Home</a>
        <a href="#products">Products</a>
        <a href="#cart">My Cart</a>
    </nav>

    <!-- Home Section -->
    <section id="home">
        <h2>Welcome to YousufMart</h2>
        <p>Shop your favourite products at the best prices.</p>
    </section>
    <div class="search-box">
    <input
        type="text"
        id="searchInput"
        placeholder="Search products..."
    >
    <button onclick="searchProducts()">Search</button>
</div>
    <div class="categories">
    <button onclick="filterProducts('All')">All</button>
    <button onclick="filterProducts('Electronics')">Electronics</button>
    <button onclick="filterProducts('Fashion')">Fashion</button>
    <button onclick="filterProducts('Shoes')">Shoes</button>
</div>

    <!-- Products Section -->
    <section id="products">
        <h2>Our Products</h2>

        <div id="product-list">
            <!-- Products will display here using JavaScript -->
        </div>
    </section>

    <!-- Cart Section -->
    <section id="cart">
        <h2>My Shopping Cart</h2>

        <div id="cart-items">
            Your cart is empty.
        </div>

        <h3 id="total">Total: ₹0</h3>
    </section>

    <!-- Footer -->
    <footer>
        <p>Developed by Shaik Mohammad Yousuf</p>
    </footer>

    <script src="app.js"></script>

</body>
</html>
